[metadata]
name = dolphin-framework
version = attr: dolphin.__version__
description = A Python framework for Solana smart contract and game development
long_description = file: README.md
long_description_content_type = text/markdown
author = Caballo Loko
author_email = caballoloko@cimai.biz
url = https://github.com/Cimai-Decentralized-Games/dolphin-project
license = Apache-2.0
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Rust
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Software Development :: Build Tools
    Topic :: Games/Entertainment

[options]
packages = find:
package_dir =
    = python
python_requires = >=3.8
install_requires =
    click>=8.0.0
    solana>=0.29.0
    anchorpy>=0.17.0
    base58>=2.1.0
    typing_extensions>=4.0.0
    construct>=2.10.0
    borsh-construct>=0.1.0
    toml>=0.10.0
    dataclasses; python_version<"3.8"

[options.packages.find]
where = python

[options.extras_require]
dev =
    pytest>=7.0
    pytest-asyncio
    pytest-cov
    black
    isort
    mypy
    tox
    build
    twine

[options.entry_points]
console_scripts =
    dolphin = dolphin.cli:main

[flake8]
max-line-length = 88
extend-ignore = E203
exclude = .tox,*.egg,build,data

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_*
addopts = --cov=dolphin --cov-report=term-missing
markers =
    integration: marks tests as integration tests
    requires_validator: marks tests requiring a Solana validator
    game: marks game-specific tests
    pda: marks tests for Program Derived Addresses
    token: marks token program tests

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 88

[coverage:run]
source = dolphin
omit =
    tests/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
