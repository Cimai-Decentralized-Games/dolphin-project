[metadata]
name = dolphin-framework
version = attr: dolphin.__version__
description = A Python framework for Solana smart contract development
long_description = file: README.md
long_description_content_type = text/markdown
author = Caballo Loko
author_email = caballoloko@cimai.biz
url = https://github.com/Cimai-Decentralized-Games/dolphin-project
license = Apache-2.0
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Software Development :: Build Tools

[options]
packages = find:
package_dir =
    = python
python_requires = >=3.7
install_requires =
    solana>=0.29.0
    anchorpy>=0.17.0
    base58>=2.1.0
    typing_extensions>=4.0.0
    dataclasses; python_version<"3.7"

[options.packages.find]
where = python

[options.extras_require]
dev =
    pytest>=7.0
    pytest-asyncio
    pytest-cov
    black
    isort
    mypy
    tox
    build
    twine

[options.entry_points]
console_scripts =
    dolphin = dolphin.cli:main

[flake8]
max-line-length = 88
extend-ignore = E203
exclude = .tox,*.egg,build,data

[mypy]
python_version = 3.7
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test
python_functions = test_*
addopts = --cov=dolphin --cov-report=term-missing
markers =
    integration: marks tests as integration tests
    requires_validator: marks tests requiring a Solana validator