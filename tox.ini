[tox]
envlist = py37, py38, py39, py310, py311
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-asyncio
    pytest-cov
    solana
    anchorpy
    base58
commands =
    pytest {posargs:tests} --cov=dolphin --cov-report=term-missing

[pytest]
asyncio_mode = auto
markers =
    integration: marks tests as integration tests
    requires_validator: marks tests requiring a Solana validator