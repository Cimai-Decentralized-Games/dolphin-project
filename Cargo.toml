[package]
name = "dolphin"
version = "0.1.0"
authors = ["Caballo Loko <caballoloko@cimai.biz>"]
edition = "2021"
description = "A Python-to-Solana framework"

[lib]
name = "dolphin"
crate-type = ["cdylib", "rlib"]

[[test]]
name = "test_pda"
path = "tests/unit/rust/test_pda.rs"

[dependencies]
pyo3 = { version = "0.23.4", features = ["extension-module"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anchor-lang = "0.30.1"
pyo3-build-config = "0.23.4"
solana-program = "2.1.11"
bs58 = "0.4"
regex = "1.5"
lazy_static = "1.4"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"


[build-dependencies]
pyo3-build-config = "0.23.4"

